name: release

on:
  push:
    branches: [main]
  # Re-publish an existing tag (e.g. the npm publish step failed after the
  # GitHub release was already cut).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to re-publish (e.g. v0.2.0)"
        required: true
        type: string

# Never run two releases at once, and never cancel one midway — a half-published
# release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance (OIDC)

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens/updates the release PR; on merge it cuts the tag + GitHub release
      # and sets release_created, which gates the publish job below.
      # NOTE: needs "Allow GitHub Actions to create and approve pull requests"
      # (Settings → Actions → General), otherwise this fails at PR creation.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please only rewrites package.json/CHANGELOG, so bun.lock can drift
      # if a dependency edit landed alongside. Re-resolve on the PR branch and
      # commit the result so the tag we publish from installs with --frozen-lockfile.
      - name: Check out release PR branch
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.prs_updated == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJson(steps.release.outputs.prs)[0].headBranchName }}

      - name: Set up Bun
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.prs_updated == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Sync bun.lock
        if: ${{ steps.release.outputs.prs_created == 'true' || steps.release.outputs.prs_updated == 'true' }}
        run: |
          bun install
          if ! git diff --quiet bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: sync bun.lock"
            git push origin HEAD:${{ fromJson(steps.release.outputs.prs)[0].headBranchName }}
          fi

  # Publishes the tag release-please just cut, or the tag given to
  # workflow_dispatch. Always builds from the tag, never from a moving branch.
  publish:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # npm (not bun) does the publishing: this repo is configured as a trusted
      # publisher on npmjs.com, so npm swaps the workflow's OIDC token (hence
      # `id-token: write` above) for a short-lived registry credential — no
      # NPM_TOKEN secret, and provenance is attached automatically.
      #
      # Trusted publishing needs npm >= 11.5.1, which is newer than what some
      # Node 24 releases bundle, so upgrade it explicitly rather than hoping.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Unpack the committed demo Composer deps so the demos suite runs (no
      # Composer/PHP needed on the runner). Same step CI uses.
      - run: bun run demos:vendor:unpack
      - run: bun run test

      # No build step: the package ships raw .ts (exports point straight at
      # src/), so the tag's working tree is already the published tarball.
      - name: Publish to npm
        run: npm publish --access public
